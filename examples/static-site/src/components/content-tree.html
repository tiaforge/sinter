<!-- A content tree (`{ type, children, value }`) as HTML: each node by its type (`node-heading`, `node-para`, …),
     text in place. Over a constant tree (a `file:` resource) the build writes it all into the page; over data
     from an API it renders in the browser. `link` is the site's own look for every link in the tree. -->
<template data-sn-component="{ tree: { children: any[] }; link: Slot<{ url: string; text: string }> }">
  <div class="content"><template data-sn-for="n in tree.children"><template data-sn-if="n.type === 'text'"><template data-sn-text="n.value"></template></template><template data-sn-else><sn-component use="`node-${n.type}`" data-sn-prop="{ node: n }"></sn-component></template></template></div>
</template>
