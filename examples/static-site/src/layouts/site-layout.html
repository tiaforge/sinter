<!-- The document every page shares: the head (SEO tags, the stylesheet) and the frame (header, footer). -->
<!doctype html>
<html lang="en" data-sn-layout="{ title: string; description: string; nav: string }">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <seo-tags data-sn-prop="{ title, description }"></seo-tags>
  <link rel="stylesheet" href="../site.css">
  <slot name="head"></slot>
</head>
<body>
  <site-header data-sn-prop="{ nav }"></site-header>
  <main><slot></slot></main>
  <site-footer></site-footer>
</body>
</html>
