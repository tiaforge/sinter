openapi: 3.1.0
info:
  title: Service metrics API
  description: >
    The dashboard's backend. The frontend reads this file at build time: `sinter({ openapi })` types
    every resource from it and checks the pages against it. The server also serves it at /api/openapi.yml.
    The numbers are samples. GET /samples is the last 30 seconds; after that, each new sample arrives as a
    `sample` event (GET /events) and takes the slot of the oldest one.
  version: 1.0.0
servers:
  - url: /api
paths:
  /services:
    get:
      operationId: listServices
      summary: The services
      responses:
        '200':
          description: The services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Service'
  /services/{id}:
    patch:
      operationId: updateService
      summary: Pause or resume a service's metrics
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicePatch'
      responses:
        '200':
          description: The service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '404':
          description: No such service
  /samples:
    get:
      operationId: listSamples
      summary: The last 30 seconds of samples, 121 per service
      responses:
        '200':
          description: The samples
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sample'
components:
  schemas:
    Service:
      type: object
      required: [id, name, paused]
      properties:
        id:
          type: string
        name:
          type: string
        paused:
          type: boolean
    ServicePatch:
      type: object
      properties:
        paused:
          type: boolean
    Sample:
      type: object
      description: >
        One measurement of a service. `slot` is its key: a service has 121 slots and a new sample takes the
        slot of the oldest, so the samples stay the same number however long the page is open.
      required: [slot, service, tick, at, status, rps, latencyMs, errorRate]
      properties:
        slot:
          type: string
        service:
          type: string
        tick:
          type: integer
          description: The number of the measurement, the same for every service in one round
        at:
          type: integer
          description: When it was measured, in ms since the epoch
        status:
          type: string
          enum: [ok, degraded, down]
        rps:
          type: number
          description: Requests per second
        latencyMs:
          type: number
          description: Median latency
        errorRate:
          type: number
          description: Share of failed requests, 0 to 1
