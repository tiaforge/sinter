<!-- The document every page shares: the head, the header and the frame around the page's content. A
     page is this tag with its content inside; the title is a prop. -->
<!doctype html>
<html lang="en" data-sn-layout="{ title?: string }">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title data-sn-text="title ? title + ' · Services' : 'Services'">Services</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../style.css">
</head>
<body>
  <header data-theme="dark" data-pad="sm">
    <div data-layout="center" style="--tm-measure: 60rem">
      <div data-layout="row" data-gap="sm">
        <strong>Services</strong>
        <nav data-layout="row" data-gap="sm" data-grow>
          <a href="/">Overview</a>
          <a href="/latency/">Latency</a>
        </nav>
        <slot name="status"></slot>
      </div>
    </div>
  </header>
  <main data-layout="center" data-gap="lg" data-pad="lg" style="--tm-measure: 60rem">
    <!-- Kept across pages: a link to the other page replaces everything around it, so the sound plays on, the
         drawer stays open and the notes keep their text and scroll position. It holds no bindings. -->
    <details class="dock" data-sn-permanent="dock">
      <summary>Player and notes</summary>
      <div data-layout="stack" data-gap="sm">
        <audio controls loop preload="none" src="/api/tone.wav"></audio>
        <textarea rows="4" aria-label="Notes" placeholder="Notes stay while you move between pages"></textarea>
      </div>
    </details>
    <slot></slot>
  </main>
</body>
</html>
