<!-- A number with its label: shared markup, expanded at build time wherever <stat-tile> is used. -->
<template data-sn-component="{ label: string; value: string | number }">
  <article>
    <small data-muted data-sn-text="label"></small>
    <div class="big" data-sn-text="value"></div>
  </article>
</template>
