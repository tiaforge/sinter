<!DOCTYPE html>
<html lang="en" data-sn-path="/ /tag/:tag">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Home — Conduit</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://code.ionicframework.com/ionicons/2.0.1/css/ionicons.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Titillium+Web:700|Source+Serif+Pro:400,700|Merriweather+Sans:400,700|Source+Sans+Pro:400,300,600,700,300italic,400italic,600italic,700italic">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div data-sn-state="{ nav: 'home', error: null }">
<sn-include src="./partials/header.html"></sn-include>

<sn-resource cache name="articles" key="slug" items="articles" total="articlesCount" when="$url.feed != 'following'"
  src="https://api.realworld.show/api/articles?tag={$url.tag}&limit=10&offset={offset($url.page, 10)}"></sn-resource>
<sn-resource cache name="feed" key="slug" items="articles" total="articlesCount" when="$url.feed == 'following' && user"
  src="https://api.realworld.show/api/articles/feed?limit=10&offset={offset($url.page, 10)}"></sn-resource>
<sn-resource cache name="tags" src="https://api.realworld.show/api/tags" items="tags"></sn-resource>
<template data-sn-if="$url.feed == 'following' && $meta.user.loadedAt && !user && !$meta.user.error"><conduit-redirect to="/login"></conduit-redirect></template>

<div class="home-page">
  <template data-sn-if="!user">
    <div class="banner"><div class="container"><h1 class="logo-font">conduit</h1><p>A place to share your knowledge.</p></div></div>
  </template>
  <div class="container page">
    <div class="row">
      <div class="col-md-9">
        <div class="feed-toggle">
          <ul class="nav nav-pills outline-active">
            <template data-sn-if="user">
              <li class="nav-item"><a class="nav-link" href="/?feed=following" data-sn-class="{active: $url.feed == 'following'}">Your Feed</a></li>
            </template>
            <li class="nav-item"><a class="nav-link" href="/" data-sn-class="{active: $url.feed != 'following' && !$url.tag}">Global Feed</a></li>
            <template data-sn-if="$url.tag">
              <li class="nav-item"><a class="nav-link active" data-sn-attr="{href: '/tag/' + encodeURIComponent($url.tag)}"><i class="ion-pound"></i> <span data-sn-text="$url.tag"></span></a></li>
            </template>
          </ul>
        </div>
        <sn-include src="./partials/errors.html"></sn-include>
        <template data-sn-if="($url.feed == 'following' ? $meta.feed : $meta.articles).error">
          <div class="article-preview error-messages">Could not load articles.</div>
        </template>
        <template data-sn-if="($url.feed == 'following' ? $meta.feed : $meta.articles).loading">
          <div class="article-preview">Loading articles...</div>
        </template>
        <template data-sn-for="a in ($url.feed == 'following' ? feed : articles)" data-sn-key="a.slug">
          <div class="article-preview">
            <div class="article-meta">
              <template data-sn-if="a.favorited">
                <button class="btn btn-primary btn-sm pull-xs-right" data-sn-delete="https://api.realworld.show/api/articles/{a.slug}/favorite"
                        data-sn-optimistic="patch('articles', a, {favorited: false, favoritesCount: a.favoritesCount - 1}); patch('feed', a, {favorited: false, favoritesCount: a.favoritesCount - 1})"
                        data-sn-catch="$error.status == 401 ? emit('navigate', '/login') : error = $error">
                  <i class="ion-heart"></i> <span data-sn-text="a.favoritesCount"></span>
                </button>
              </template>
              <template data-sn-else>
                <button class="btn btn-outline-primary btn-sm pull-xs-right" data-sn-post="https://api.realworld.show/api/articles/{a.slug}/favorite"
                        data-sn-optimistic="patch('articles', a, {favorited: true, favoritesCount: a.favoritesCount + 1}); patch('feed', a, {favorited: true, favoritesCount: a.favoritesCount + 1})"
                        data-sn-catch="$error.status == 401 ? emit('navigate', '/login') : error = $error">
                  <i class="ion-heart"></i> <span data-sn-text="a.favoritesCount"></span>
                </button>
              </template>
              <sn-include src="./partials/byline.html"></sn-include>
            </div>
            <sn-include src="./partials/preview.html"></sn-include>
          </div>
        </template>
        <template data-sn-if="!($url.feed == 'following' ? $meta.feed : $meta.articles).loading && ($url.feed == 'following' ? $meta.feed : $meta.articles).loadedAt && !($url.feed == 'following' ? feed : articles).length">
          <template data-sn-if="$url.feed == 'following'">
            <div class="article-preview empty-feed-message">Your feed is empty. Follow some authors or check the <a href="/">Global Feed</a>.</div>
          </template>
          <template data-sn-else><div class="article-preview empty-feed-message">No articles are here... yet.</div></template>
        </template>
        <template data-sn-if="pages(($url.feed == 'following' ? $meta.feed : $meta.articles).total, 10).length > 1">
          <nav>
            <ul class="pagination">
              <template data-sn-for="n in pages(($url.feed == 'following' ? $meta.feed : $meta.articles).total, 10)" data-sn-key="n">
                <li class="page-item" data-sn-class="{active: n == (Number.parseInt($url.page, 10) || 1)}">
                  <a class="page-link" data-sn-text="n"
                     data-sn-attr="{href: ($url.tag ? '/tag/' + encodeURIComponent($url.tag) : '/') + '?' + ($url.feed ? 'feed=' + encodeURIComponent($url.feed) + '&' : '') + 'page=' + n}"></a>
                </li>
              </template>
            </ul>
          </nav>
        </template>
      </div>
      <div class="col-md-3">
        <div class="sidebar">
          <p>Popular Tags</p>
          <template data-sn-if="$meta.tags.loading"><div>Loading tags...</div></template>
          <template data-sn-if="$meta.tags.error"><div class="error-messages">Could not load tags.</div></template>
          <div class="tag-list">
            <template data-sn-for="t in tags ?? []" data-sn-key="t">
              <a class="tag-pill tag-default" data-sn-attr="{href: '/tag/' + encodeURIComponent(t)}" data-sn-text="t"></a>
            </template>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<sn-include src="./partials/footer.html"></sn-include>
</div>
</body>
</html>
