<conduit-layout data-sn-path="/login"
  data-sn-state="{ nav: 'login', guest: signedOut(), email: '', password: '' }"
  data-sn-prop="{ nav, guest, title: 'Sign in', description: 'Sign in to Conduit.' }">
<!-- early="off": the auth middleware answers this request without a token, and adds one otherwise:
     a request sent before the page module would go unused -->
<sn-resource cache name="user" src="https://api.realworld.show/api/user" items="user" then="guest = !$result" early="off"></sn-resource>

<main class="auth-page">
  <div class="container page">
    <div class="row">
      <div class="col-md-6 offset-md-3 col-xs-12">
        <h1 class="text-xs-center">Sign in</h1>
        <p class="text-xs-center"><a href="/register">Need an account?</a></p>
        <form data-sn-post="https://api.realworld.show/api/users/login" data-sn-body="{user: {email, password}}"
              data-sn-then="emit('signed-in', {user: $result.user, to: /^\/(?!\/)/.test($url.next || '') ? $url.next : null})">
          <error-list data-sn-prop="{ error: $error }"></error-list>
          <fieldset>
            <fieldset class="form-group"><input class="form-control form-control-lg" type="email" name="email" placeholder="Email" data-sn-model="email"></fieldset>
            <fieldset class="form-group"><input class="form-control form-control-lg" type="password" name="password" placeholder="Password" data-sn-model="password"></fieldset>
            <button class="btn btn-lg btn-primary pull-xs-right" type="submit">Sign in</button>
          </fieldset>
        </form>
      </div>
    </div>
  </div>
</main>

</conduit-layout>
