<!-- `.error-messages` for the `error` state variable, set by the buttons' catches (favorite, follow,
     delete). Forms show their errors in their own `data-sn-errors` list. -->
<template data-sn-if="error">
  <ul class="error-messages">
    <template data-sn-for="m in errors(error)" data-sn-key="m"><li data-sn-text="m"></li></template>
  </ul>
</template>
