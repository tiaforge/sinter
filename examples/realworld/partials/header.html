<!-- Navbar. Declares the `user` resource; expects a `nav` state variable naming the active link. -->
<sn-resource name="user" src="https://api.realworld.show/api/user" items="user"></sn-resource>
<nav class="navbar navbar-light">
  <div class="container">
    <a class="navbar-brand" href="/">conduit</a>
    <ul class="nav navbar-nav pull-xs-right">
      <li class="nav-item"><a class="nav-link" href="/" data-sn-class="{active: nav == 'home'}">Home</a></li>
      <template data-sn-if="user">
        <li class="nav-item"><a class="nav-link" href="/editor" data-sn-class="{active: nav == 'editor'}"><i class="ion-compose"></i>&nbsp;New Article</a></li>
        <li class="nav-item"><a class="nav-link" href="/settings" data-sn-class="{active: nav == 'settings'}"><i class="ion-gear-a"></i>&nbsp;Settings</a></li>
        <li class="nav-item">
          <a class="nav-link" data-sn-attr="{href: '/profile/' + encodeURIComponent(user.username)}" data-sn-class="{active: nav == 'profile:' + user.username}">
            <img class="user-pic" alt="" data-sn-attr="{src: avatar(user.image)}"> <span data-sn-text="user.username"></span>
          </a>
        </li>
      </template>
      <template data-sn-else>
        <template data-sn-if="$meta.user.error">
          <li class="nav-item"><span class="nav-link">Connecting…</span></li>
          <li class="nav-item"><button class="btn btn-sm btn-outline-secondary" type="button" data-sn-on-click="refresh('user')">Retry</button></li>
        </template>
        <!-- signed-out links only once the user is known, not while the session is checked -->
        <template data-sn-if="!$meta.user.error && $meta.user.loadedAt">
          <li class="nav-item"><a class="nav-link" href="/login" data-sn-class="{active: nav == 'login'}">Sign in</a></li>
          <li class="nav-item"><a class="nav-link" href="/register" data-sn-class="{active: nav == 'register'}">Sign up</a></li>
        </template>
      </template>
    </ul>
  </div>
</nav>
