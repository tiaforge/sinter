<!-- The document every page shares: the head, the navbar and the footer. A page is this tag, with its
     state (`nav`, `guest` and its own fields) and its title and description as props; its content is
     the body between the navbar and the footer. -->
<!DOCTYPE html>
<html lang="en" data-sn-layout="{ nav: string; guest: boolean; title: string; description: string }">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <conduit-seo data-sn-prop="{ title, description }"></conduit-seo>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://code.ionicframework.com/ionicons/2.0.1/css/ionicons.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Titillium+Web:700|Source+Serif+Pro:400,700|Merriweather+Sans:400,700|Source+Sans+Pro:400,300,600,700,300italic,400italic,600italic,700italic">
  <link rel="stylesheet" href="/styles.css">
  <slot name="head"></slot>
</head>
<body>
<conduit-header data-sn-prop="{ nav, guest }"></conduit-header>
<slot></slot>
<conduit-footer></conduit-footer>
</body>
</html>
