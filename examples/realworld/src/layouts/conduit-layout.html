<!-- The document every page shares: the head, the navbar and the footer. A page is this tag, with its
     active link (`nav`), title and description as props; its content is the body
     between the navbar and the footer. -->
<!DOCTYPE html>
<html lang="en" data-sn-props="{ nav: string; title: string; description: string }">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <conduit-seo data-sn-with="{ title, description }"></conduit-seo>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://code.ionicframework.com/ionicons/2.0.1/css/ionicons.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Titillium+Web:700|Source+Serif+Pro:400,700|Merriweather+Sans:400,700|Source+Sans+Pro:400,300,600,700,300italic,400italic,600italic,700italic">
  <link rel="stylesheet" href="/src/styles.css">
  <slot name="head"></slot>
</head>
<!-- a failed button (favorite, follow, delete) that nothing else showed: its error under the navbar on every page
     (a 401 goes to sign in: the API's `signIn`, apis.js; forms show theirs, including a 401, in their own list) -->
<body data-sn-state="{ error: null }"
  data-sn-on-sn-error="error = $event.detail.error; $event.preventDefault()">
<!-- signed out (no token stored): loaded at once, empty, with no request -->
<sn-resource cache name="user" src="/user"></sn-resource>
<conduit-header data-sn-with="{ nav }"></conduit-header>
<div class="container"><error-list data-sn-with="{ error }"></error-list></div>
<slot></slot>
<conduit-footer></conduit-footer>
</body>
</html>
