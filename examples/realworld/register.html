<conduit-layout data-sn-path="/register"
  data-sn-state="{ nav: 'register', username: '', email: '', password: '' }"
  data-sn-prop="{ nav, title: 'Sign up', description: 'Create a Conduit account.' }">

<main class="auth-page">
  <div class="container page">
    <div class="row">
      <div class="col-md-6 offset-md-3 col-xs-12">
        <h1 class="text-xs-center">Sign up</h1>
        <p class="text-xs-center"><a href="/login">Have an account?</a></p>
        <form data-sn-post="/users" data-sn-body="{user: {username, email, password}}"
              data-sn-then="emit('signed-in', {user: $result.user})">
          <error-list data-sn-prop="{ error: $error }"></error-list>
          <fieldset>
            <fieldset class="form-group"><input class="form-control form-control-lg" type="text" name="username" placeholder="Username" data-sn-model="username"></fieldset>
            <fieldset class="form-group"><input class="form-control form-control-lg" type="email" name="email" placeholder="Email" data-sn-model="email"></fieldset>
            <fieldset class="form-group"><input class="form-control form-control-lg" type="password" name="password" placeholder="Password" data-sn-model="password"></fieldset>
            <button class="btn btn-lg btn-primary pull-xs-right" type="submit">Sign up</button>
          </fieldset>
        </form>
      </div>
    </div>
  </div>
</main>

</conduit-layout>
