<!DOCTYPE html>
<html lang="en" data-sn-path="/register">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign up — Conduit</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://code.ionicframework.com/ionicons/2.0.1/css/ionicons.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Titillium+Web:700|Source+Serif+Pro:400,700|Merriweather+Sans:400,700|Source+Sans+Pro:400,300,600,700,300italic,400italic,600italic,700italic">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div data-sn-state="{ nav: 'register', error: null, username: '', email: '', password: '' }">
<sn-include src="./partials/header.html"></sn-include>

<div class="auth-page">
  <div class="container page">
    <div class="row">
      <div class="col-md-6 offset-md-3 col-xs-12">
        <h1 class="text-xs-center">Sign up</h1>
        <p class="text-xs-center"><a href="/login">Have an account?</a></p>
        <sn-include src="./partials/errors.html"></sn-include>
        <form data-sn-post="https://api.realworld.show/api/users" data-sn-body="{user: {username, email, password}}"
              data-sn-then="error = null; emit('signed-in', {user: $result.user})" data-sn-catch="error = $error">
          <fieldset>
            <fieldset class="form-group"><input class="form-control form-control-lg" type="text" name="username" placeholder="Username" data-sn-model="username"></fieldset>
            <fieldset class="form-group"><input class="form-control form-control-lg" type="email" name="email" placeholder="Email" data-sn-model="email"></fieldset>
            <fieldset class="form-group"><input class="form-control form-control-lg" type="password" name="password" placeholder="Password" data-sn-model="password"></fieldset>
            <button class="btn btn-lg btn-primary pull-xs-right" type="submit">Sign up</button>
          </fieldset>
        </form>
      </div>
    </div>
  </div>
</div>

<sn-include src="./partials/footer.html"></sn-include>
</div>
</body>
</html>
