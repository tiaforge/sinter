<conduit-layout data-sn-path="/editor /editor/:slug"
  data-sn-state="{ nav: 'editor' }"
  data-sn-prop="{ nav, title: 'Editor', description: 'Write or edit an article on Conduit.' }">
<template data-sn-if="$meta.user.loadedAt && !user && !$meta.user.error"><conduit-redirect to="/login"></conduit-redirect></template>
<sn-resource cache name="article" src="/articles/{$url.slug}" when="$url.slug"></sn-resource>

<main class="editor-page">
  <div class="container page">
    <div class="row">
      <div class="col-md-10 offset-md-1 col-xs-12">
        <template data-sn-if="$meta.article.error"><p>This article cannot be loaded.</p></template>
        <template data-sn-if="user && (!$url.slug || article)">
          <form data-sn-on-submit="$event.preventDefault()"
                data-sn-state="{ d: article ? {title: article.title, description: article.description, body: article.body, tagList: [...article.tagList]} : {title: '', description: '', body: '', tagList: []}, tag: '' }">
            <error-list data-sn-prop="{ error: $error }"></error-list>
            <fieldset>
              <fieldset class="form-group"><input type="text" class="form-control form-control-lg" name="title" placeholder="Article Title" data-sn-model="d.title"></fieldset>
              <fieldset class="form-group"><input type="text" class="form-control" name="description" placeholder="What's this article about?" data-sn-model="d.description"></fieldset>
              <fieldset class="form-group"><textarea class="form-control" rows="8" name="body" placeholder="Write your article (in markdown)" data-sn-model="d.body"></textarea></fieldset>
              <fieldset class="form-group">
                <input type="text" class="form-control" placeholder="Enter tags" data-sn-model="tag"
                       data-sn-on-keydown-enter="d.tagList = withTag(d.tagList, tag); tag = ''">
                <div class="tag-list">
                  <template data-sn-for="(t, i) in d.tagList" data-sn-key="t">
                    <span class="tag-default tag-pill"><i class="ion-close-round" data-sn-on-click="d.tagList.splice(i, 1)"></i> <span data-sn-text="t"></span></span>
                  </template>
                </div>
              </fieldset>
              <template data-sn-if="$url.slug">
                <button class="btn btn-lg pull-xs-right btn-primary" type="button" data-sn-put="/articles/{$url.slug}" data-sn-body="{article: {...d, tagList: withTag(d.tagList, tag)}}"
                        data-sn-then="navigate('/article/' + encodeURIComponent($result.article.slug))">Publish Article</button>
              </template>
              <template data-sn-else>
                <button class="btn btn-lg pull-xs-right btn-primary" type="button" data-sn-post="/articles" data-sn-body="{article: {...d, tagList: withTag(d.tagList, tag)}}"
                        data-sn-then="navigate('/article/' + encodeURIComponent($result.article.slug))">Publish Article</button>
              </template>
            </fieldset>
          </form>
        </template>
      </div>
    </div>
  </div>
</main>

</conduit-layout>
