<conduit-layout data-sn-path="/settings"
  data-sn-state="{ nav: 'settings' }"
  data-sn-prop="{ nav, title: 'Settings', description: 'Your Conduit settings: picture, name, bio, email and password.' }">
<template data-sn-if="$meta.user.loadedAt && !user && !$meta.user.error"><conduit-redirect to="/login"></conduit-redirect></template>

<main class="settings-page">
  <div class="container page">
    <div class="row">
      <div class="col-md-6 offset-md-3 col-xs-12">
        <h1 class="text-xs-center">Your Settings</h1>
        <template data-sn-if="$meta.user.error"><p>Your settings cannot be loaded right now.</p></template>
        <template data-sn-if="user">
          <form data-sn-state="{ s: {image: user.image ?? '', username: user.username, bio: user.bio ?? '', email: user.email, password: ''} }"
                data-sn-put="/user"
                data-sn-body="{user: {image: s.image, username: s.username, bio: s.bio, email: s.email, password: s.password || undefined}}"
                data-sn-then="emit('signed-in', {user: $result.user, to: '/profile/' + encodeURIComponent($result.user.username)})">
            <error-list data-sn-prop="{ error: $error }"></error-list>
            <fieldset>
              <fieldset class="form-group"><input class="form-control" type="text" name="image" placeholder="URL of profile picture" data-sn-model="s.image"></fieldset>
              <fieldset class="form-group"><input class="form-control form-control-lg" type="text" name="username" placeholder="Your Name" data-sn-model="s.username"></fieldset>
              <fieldset class="form-group"><textarea class="form-control form-control-lg" rows="8" name="bio" placeholder="Short bio about you" data-sn-model="s.bio"></textarea></fieldset>
              <fieldset class="form-group"><input class="form-control form-control-lg" type="email" name="email" placeholder="Email" data-sn-model="s.email"></fieldset>
              <fieldset class="form-group"><input class="form-control form-control-lg" type="password" name="password" placeholder="New Password" autocomplete="new-password" data-sn-model="s.password"></fieldset>
              <button class="btn btn-lg btn-primary pull-xs-right" type="submit">Update Settings</button>
            </fieldset>
          </form>
          <hr>
          <button class="btn btn-outline-danger" type="button" data-sn-on-click="emit('signed-out')">Or click here to logout.</button>
        </template>
      </div>
    </div>
  </div>
</main>

</conduit-layout>
