<template data-sn-component="{ current: string; items: { id: string; href: string; label: string }[] }">
  <ul class="nav">
    <template data-sn-for="i in items">
      <li><a data-sn-attr="{ href: i.href, 'aria-current': i.id === current ? 'page' : null }" data-sn-text="i.label"></a></li>
    </template>
  </ul>
</template>
<style>
  .nav { display: flex; gap: 1rem; list-style: none; margin: 0; padding: 0; }
  [aria-current="page"] { font-weight: 700; }
</style>
