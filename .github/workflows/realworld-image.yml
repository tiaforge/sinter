name: RealWorld image

# examples/realworld with its data in the page, served by sinter-axum's example server (examples/realworld/Dockerfile),
# published as ghcr.io/<owner>/sinter-realworld: `docker run --rm -p 8080:8080 ghcr.io/<owner>/sinter-realworld`.
# The first push creates the package private: make it public once in the package's settings.
on:
  push:
    branches: [main]
    paths:
      - examples/realworld/**
      - packages/sinter-axum/**
      - src/**
      - package.json
      - package-lock.json
      - .dockerignore
      - .github/workflows/realworld-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: realworld-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # the repository's name as a label links the package to it; the owner's name, lower case, is the image's
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/sinter-realworld
          tags: |
            type=raw,value=latest
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: examples/realworld/Dockerfile
          # arm64 for the free ARM hosts; built under emulation, so slower than amd64
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
