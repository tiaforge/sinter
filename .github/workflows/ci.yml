name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # vitest and jsdom need Node 22+; the package itself also supports 20.19.
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Chromium for the tests that compare with a real browser (layout, the dev image check, built pages)
      - run: npx playwright install --with-deps chromium
      - run: npm test
      # size budgets: the minimal page and the RealWorld example's pages (its own dependencies first)
      - run: npm ci --prefix examples/realworld
      - run: npm run size -- --check

  # the Rust middleware that fills embedded data (packages/sinter-axum)
  sinter-axum:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sinter-axum
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/sinter-axum
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --features upstream -- -D warnings
      # the embed! macro's compile errors are checked too (trybuild, tests/ui)
      - run: cargo test --workspace
      - run: cargo test --features upstream
      - run: cargo build --no-default-features

  # sinter across page loads in a real browser: next-page data, Speculation Rules, morphs
  # (e2e/navigation/README.md); the runner's Chrome
  e2e-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm ci --prefix e2e/navigation
      - run: node e2e/navigation/run.mjs
        env:
          CHROME: google-chrome
