name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # vitest and jsdom need Node 22+; the package itself also supports 20.19.
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Chromium for the tests that compare with a real browser (layout, the dev image check, built pages);
      # Firefox and WebKit too, for those that must hold in every engine (components: scoped styles, scripts)
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm test
      # size budgets: the minimal page and the RealWorld example's pages (its own dependencies first)
      - run: npm ci --prefix examples/realworld
      - run: npm run size -- --check

  # shared definitions linked into each page (docs/proposals/compile-once.md, (5)): every compile in the suite is also
  # compiled through linking and must be the same (SN_LINK_AUDIT); the summary says how many pages linked something
  link-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm test
        env:
          SN_LINK_AUDIT: '1'
          SN_LINK_AUDIT_LOG: ${{ runner.temp }}/link-audit.jsonl
      - if: always()
        run: >-
          node -e 'const l = require("fs").readFileSync(process.argv[1], "utf8").trim().split("\n").filter(Boolean).map(JSON.parse);
          console.log(`link audit: ${l.length} compiles, ${l.filter((x) => x.linked).length} linked ${l.reduce((a, x) => a + x.linked, 0)} definitions, ${l.filter((x) => x.refused.length).length} refused one`);
          for (const r of new Set(l.flatMap((x) => x.refused))) console.log("  refused:", r)' "$RUNNER_TEMP/link-audit.jsonl"

  # the Rust middleware that fills embedded data (packages/sinter-axum)
  sinter-axum:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sinter-axum
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/sinter-axum
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --features upstream -- -D warnings
      # the embed! macro's compile errors are checked too (trybuild, tests/ui)
      - run: cargo test --workspace
      - run: cargo test --features upstream
      - run: cargo build --no-default-features

  # the ASP.NET Core middleware that fills embedded data (packages/sinter-aspnetcore)
  sinter-aspnetcore:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sinter-aspnetcore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      # warnings are errors (Directory.Build.props), the AOT and trim analyzers included
      - run: dotnet build -c Release
      # net8.0 and net10.0: minimal APIs and MVC, and the generator's compile errors
      - run: dotnet test -c Release --no-build
      # the packed package in a NativeAOT app, its pages checked
      - run: test/AotSmoke/run.sh

  # the markdown component library (packages/sinter-markdown), tested against the framework's own build:
  # its fixture pages through `sinter check`, the parser, a static build and the browser under Trusted Types
  sinter-markdown:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/sinter-markdown
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/sinter-markdown/package-lock.json
      - run: npm ci
        working-directory: .
      - run: npm run build
        working-directory: .
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npx sinter check
      - run: npm test

  # the dashboard example built against this repository's sinter. Its package.json depends on sinter from
  # npm so that StackBlitz, which installs that folder alone, can run it; here the local build replaces it.
  # The timeout turns a build that never exits into a failure.
  example-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm install
        working-directory: examples/dashboard
      - run: npm install --no-save ../..
        working-directory: examples/dashboard
      - run: test "$(readlink -f node_modules/@tiaforge-ui/sinter)" = "$GITHUB_WORKSPACE"
        working-directory: examples/dashboard
      - run: timeout 300 npx vite build
        working-directory: examples/dashboard
      # with swaps on: the player plays on across a link and Back, in Chromium, Firefox and WebKit
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: node e2e-swap.mjs
        working-directory: examples/dashboard

  # sinter across page loads in a real browser: next-page data, Speculation Rules, morphs
  # (e2e/navigation/README.md); the runner's Chrome
  e2e-navigation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm ci --prefix e2e/navigation
      - run: node e2e/navigation/run.mjs
        env:
          CHROME: google-chrome

  # same-page links, navigate() and data-sn-on-navigate through the navigation chain (e2e/links), and swaps with
  # kept elements (e2e/permanent), in Chromium, Firefox and WebKit: the Navigation API's navigate event, where
  # each browser has it
  e2e-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm ci --prefix e2e/links
      - run: node e2e/links/run.mjs
      # swaps and kept elements (sinter({ swap: true }))
      - run: npm ci --prefix e2e/permanent
      - run: node e2e/permanent/run.mjs
      # swaps under a nonce CSP, with built-in messages (a dictionary per page)
      - run: npm ci --prefix e2e/swap-csp
      - run: node e2e/swap-csp/run.mjs
