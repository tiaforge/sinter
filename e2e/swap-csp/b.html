<csp-layout data-sn-with="{ title: m.b_title() }">
  <!-- B's own inline style: under a nonce policy the swap must give it the document's nonce -->
  <style slot="head">#heading { color: rgb(0, 128, 0); }</style>
  <h1 id="heading" data-sn-state="{ name: 'B' }" data-sn-text="m.greeting({ name })"></h1>
</csp-layout>
