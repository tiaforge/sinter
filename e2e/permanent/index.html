<two-layout data-sn-with="{ title: info ? 'A: ' + info.name : 'A', description: info?.about ?? '', kind: 'a' }">
  <sn-resource name="info" src="/api/a.json" items="info"></sn-resource>
  <h1 id="heading" data-sn-text="info?.name"></h1>
  <!-- a morph: the same name on both pages (B's heading) -->
  <p><a id="to-b-morph" href="/b/"><span id="morph" data-sn-transition="'hero'">Beta</span></a></p>
  <p id="count" data-sn-state="{ n: 0 }"><button id="inc" data-sn-on-click="n = n + 1">+</button> <span data-sn-text="'A ' + n"></span></p>
  <button id="go-b" data-sn-on-click="navigate('/b/')">to B from a handler</button>
  <!-- a same-page link, the address's query, a GET form and a link to another site (same origin here) -->
  <p><a id="same" href="?q=1">q=1</a> <span id="q" data-sn-text="$url.q ?? 'none'"></span></p>
  <form id="get" method="get" action="/b/"><button id="get-go">go</button></form>
  <a id="external" href="/b/" rel="external">B as another site</a>
</two-layout>
