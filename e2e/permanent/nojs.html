<!-- A page of constants: it ships no JavaScript, so it is swapped in with nothing to mount (requested once), and
     links from it are page loads. -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>No JS</title>
  <style>@media (prefers-reduced-motion: no-preference) { @view-transition { navigation: auto; } }</style>
</head>
<body>
  <nav><a id="to-a" href="/">A</a> <a id="to-b" href="/b/">B</a></nav>
  <main><h1 id="heading">Constants only</h1></main>
</body>
</html>
