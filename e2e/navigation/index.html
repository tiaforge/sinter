<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Items</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- cache: going back, the reloaded list has its rows at its first paint, so the title morphs into its row -->
  <sn-resource cache name="items" src="/api/items" items="items" key="id"></sn-resource>
  <h1>Items</h1>
  <ul id="items">
    <template data-sn-for="i in items">
      <li><a data-sn-attr="{href: '/item/' + i.id}"><span data-sn-transition="'item-' + i.id" data-sn-text="i.title"></span></a></li>
    </template>
  </ul>
</body>
</html>
