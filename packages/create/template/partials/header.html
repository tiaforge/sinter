<!-- Shared by every page (<sn-include> inlines it at build time). It reads the page's `armed` state.
     data-theme="dark": a dark band on a light page is one attribute. -->
<header data-theme="dark" data-pad="sm">
  <div data-layout="center" style="--tm-measure: 48rem">
    <div data-layout="row" data-gap="sm" data-justify="between">
      <a href="/" data-icon="circle-check" data-layout="row" data-gap="xs"><strong>Tasks</strong></a>
      <!-- a plain POST action; the next failed change resets `armed` (data-sn-on-sn-error on <body>) -->
      <button data-variant="outline" data-size="sm" data-icon="triangle-alert"
              data-sn-post="/api/fail-next" data-sn-then="armed = true"
              data-sn-attr="{'aria-pressed': armed ? 'true' : 'false'}">Fail next change</button>
    </div>
  </div>
</header>
