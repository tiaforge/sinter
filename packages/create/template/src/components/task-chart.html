<!-- A component with a script (task-chart.ts beside it): sinter renders the markup, the script draws
     the ring on the canvas. The label is a binding, so it is in the first frame. -->
<template data-sn-component="{ tasks: Task[]; show: string }" data-sn-emits="{ pick: 'done' | 'open' | 'all' }">
  <figure class="chart" role="img" data-sn-attr="{ 'aria-label': tasks.filter((t) => t.done).length + ' of ' + tasks.length + ' tasks done' }">
    <canvas data-sn-ref="canvas"></canvas>
    <!-- resolves temper's color tokens for the canvas -->
    <span data-sn-ref="probe" hidden></span>
  </figure>
</template>

<style>
  .chart { display: block; inline-size: 9rem; aspect-ratio: 1; margin: 0; cursor: pointer; }
  canvas { display: block; }
</style>
