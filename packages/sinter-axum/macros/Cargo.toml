[package]
name = "sinter-axum-macros"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "embed!: checks a sinter build's data placeholders against a sinter-axum configuration at compile time."
license = "MIT"
repository = "https://github.com/tiaforge/sinter"

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
serde_json = "1"
syn = { version = "2", features = ["full"] }
