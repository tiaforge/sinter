[package]
name = "sinter-axum-macros"
version = "0.15.0"
edition = "2024"
rust-version = "1.85"
description = "embed!: checks a sinter build's data placeholders against a sinter-axum configuration at compile time."
license = "MIT"
repository = "https://github.com/tiaforge/sinter"
homepage = "https://github.com/tiaforge/sinter/tree/main/packages/sinter-axum"
keywords = ["sinter", "axum", "macro", "html"]
categories = ["web-programming::http-server"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
serde_json = "1"
syn = { version = "2", features = ["full"] }
