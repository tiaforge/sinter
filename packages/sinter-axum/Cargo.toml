[package]
name = "sinter-axum"
version = "0.18.0"
edition = "2024"
rust-version = "1.85"
description = "Fills a sinter build's embedded-data placeholders per request: the page's API data in the first frame, without server rendering. A tower layer for axum."
license = "MIT"
repository = "https://github.com/tiaforge/sinter"
homepage = "https://github.com/tiaforge/sinter/tree/main/packages/sinter-axum"
readme = "README.md"
keywords = ["sinter", "axum", "tower", "middleware", "html"]
categories = ["web-programming::http-server"]

[workspace]
members = [".", "macros"]

[features]
default = ["macros"]
# `embed!`: the build's placeholders checked against your resolvers when your crate compiles
macros = ["dep:sinter-axum-macros"]
# opt-in: fetch over HTTP (reqwest, rustls): an API on another server (`Embed::upstream`) and absolute `src` URLs
upstream = ["dep:reqwest"]

[dependencies]
axum = { version = "0.8", default-features = false }
bytes = "1"
form_urlencoded = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
http-body-util = "0.1"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time"] }
tower = { version = "0.5", features = ["util"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls"], optional = true }
sinter-axum-macros = { version = "0.18.0", path = "macros", optional = true }

[dev-dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.7", features = ["fs", "compression-gzip"] }
# the examples' gzip on zlib-ng, the library .NET ships (and Node and Bun a zlib of their own), not flate2's
# default miniz_oxide: bench/in-process compares the layers, not their compressors
flate2 = { version = "1.1", features = ["zlib-ng"] }
trybuild = "1"

[[example]]
name = "realworld"
required-features = ["upstream"]
