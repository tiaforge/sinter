<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>@tiaforge-ui/sinter-markdown: every slot filled</title>
</head>
<body data-sn-state="{ source: '# Title\n\nA [link](/a) and `code`.\n\n```sh\nnpm i\n```\n\n> quoted\n\n| a |\n| - |\n| 1 |\n\n![alt](/x.png)' }">
  <!-- Each declared slot, filled. `<slot>` in a fill is the default element's children. -->
  <md-doc data-sn-prop="{ doc: md.parse(source) }">
    <template slot="heading" data-sn-if="$slot.node.depth === 1"><h1 class="title" data-sn-attr="{ id: 'md-' + $slot.node.slug }"><slot></slot></h1></template>
    <template data-sn-else><h2 data-sn-attr="{ id: 'md-' + $slot.node.slug }"><slot></slot> <a data-sn-attr="{ href: '#md-' + $slot.node.slug }">#</a></h2></template>
    <a slot="link" class="link" data-sn-attr="{ href: $slot.node.url }"><slot></slot> ↗</a>
    <img slot="image" loading="lazy" data-sn-attr="{ src: $slot.node.url, alt: $slot.node.alt }">
    <figure slot="code" class="code"><pre><code data-sn-text="$slot.node.value"></code></pre><figcaption data-sn-text="$slot.node.lang"></figcaption></figure>
    <code slot="inlineCode" class="ic" data-sn-text="$slot.node.value"></code>
    <blockquote slot="blockquote" class="quote"><slot></slot></blockquote>
    <div slot="table" class="scroll"><slot></slot></div>
  </md-doc>
  <h1><md-inline data-sn-prop="{ doc: md.parse('A *title* with [a link](/t)') }"><a slot="link" class="title-link" data-sn-attr="{ href: $slot.node.url }"><slot></slot></a></md-inline></h1>
</body>
</html>
