<!--
  A table: the first row is the header, `align` per column as GitHub writes it (an inline style would
  need 'unsafe-inline'). The slot's default is a wrapper around the table: the HTML parser moves a
  <slot> written inside a <table> out of it, so a fill places the whole table (<slot></slot> in a
  <div class="scroll">), or renders its own.
-->
<template data-sn-component="{ node: Table }">
  <slot name="table" data-sn-prop="{ node }"><div class="md-table"><table><thead><template data-sn-for="r in node.children.slice(0, 1)"><tr><template data-sn-for="(c, k) in r.children"><th data-sn-attr="{ align: node.align[k] }"><template data-sn-for="n in c.children"><template data-sn-if="n.type === 'text'"><template data-sn-text="n.value"></template></template><template data-sn-else><sn-component use="{ emphasis: 'md-emphasis', strong: 'md-strong', delete: 'md-delete', inlineCode: 'md-inline-code', break: 'md-break', link: 'md-link', image: 'md-image', kbd: 'md-kbd', sub: 'md-sub', sup: 'md-sup', mark: 'md-mark' }[n.type]" data-sn-prop="{ node: n }"></sn-component></template></template></th></template></tr></template></thead><template data-sn-if="node.children.length > 1"><tbody><template data-sn-for="r in node.children.slice(1)"><tr><template data-sn-for="(c, k) in r.children"><td data-sn-attr="{ align: node.align[k] }"><template data-sn-for="n in c.children"><template data-sn-if="n.type === 'text'"><template data-sn-text="n.value"></template></template><template data-sn-else><sn-component use="{ emphasis: 'md-emphasis', strong: 'md-strong', delete: 'md-delete', inlineCode: 'md-inline-code', break: 'md-break', link: 'md-link', image: 'md-image', kbd: 'md-kbd', sub: 'md-sub', sup: 'md-sup', mark: 'md-mark' }[n.type]" data-sn-prop="{ node: n }"></sn-component></template></template></td></template></tr></template></tbody></template></table></div></slot>
</template>
