<!-- A link: its URL is an attribute binding, so sinter refuses javascript: and other unsafe schemes. -->
<template data-sn-component="{ node: Link }">
  <slot name="link" data-sn-prop="{ node }"><a data-sn-attr="{ href: node.url, title: node.title }"><template data-sn-for="n in node.children"><template data-sn-if="n.type === 'text'"><template data-sn-text="n.value"></template></template><template data-sn-else><md-phrasing data-sn-prop="{ node: n }"></md-phrasing></template></template></a></slot>
</template>
