<!--
  md-doc: a parsed document, block content. Public.
  <md-doc data-sn-prop="{ doc }"></md-doc>, `doc` from md.parse (or an API that sends the tree).
  Its root is a plain element, so the tag may carry an id or a class; with no doc it is empty.
  The slots below are the library's whole contract: a fill changes how that kind of node renders,
  wherever it is in the tree.
-->
<template data-sn-component="{ doc?: Root | null; heading: Slot<{ node: Heading }>; link: Slot<{ node: Link }>; image: Slot<{ node: Image }>; code: Slot<{ node: Code }>; inlineCode: Slot<{ node: InlineCode }>; blockquote: Slot<{ node: Blockquote }>; table: Slot<{ node: Table }> }">
  <div class="md"><template data-sn-for="b in doc ? doc.children : []"><sn-component use="{ paragraph: 'md-paragraph', heading: 'md-heading', thematicBreak: 'md-thematic-break', blockquote: 'md-blockquote', list: 'md-list', code: 'md-code', table: 'md-table', details: 'md-details' }[b.type]" data-sn-prop="{ node: b }"></sn-component></template></div>
</template>
