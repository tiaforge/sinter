<!-- Messages: m.key() from the inlang files (project.inlang, messages/{locale}.json), with {param}s.
     A page has one language, chosen at build: its text is in the HTML, and the message that reads data is
     compiled into its script in that language. With sinter({ localePrefix: true }) the page is built once per
     language (/en/, /de/), and switching is a link: localeUrl('de') is this page in German. -->
<body>
  <sn-resource name="inbox" src="/api/inbox" type="any"></sn-resource>
  <h1 data-sn-text="m.inbox_title()"></h1>
  <p data-sn-text="m.inbox_count({ count: inbox ? inbox.unread : 0 })"></p>
  <p data-sn-text="m.language() + ': ' + $locale"></p>
</body>
