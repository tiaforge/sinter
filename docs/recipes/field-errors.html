<!-- Server validation errors on the fields: no data-sn-catch, so a 4xx with
     {errors: {email: "…"}} marks the field aria-invalid and shows the message after it
     (temper styles aria-invalid). `aria-errormessage` puts a message where you want it;
     data-sn-errors shows what no field takes, or the error itself (a 5xx). -->
<form data-sn-post="/api/signup" data-sn-then="emit('signed-up', $result)">
  <ul data-sn-errors role="alert" hidden></ul>
  <label>Email <input type="email" name="email" required></label>
  <label>Username <input name="username" required aria-errormessage="username-error"></label>
  <small id="username-error" hidden></small>
  <button>Sign up</button>
</form>
