<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>petite-vue-0.4.1</title>
  <link rel="icon" href="data:,">
  <script type="module" src="./bench.js"></script>
  <script src="/vendor/petite-vue-0.4.1.iife.js"></script>
</head>
<body>
<!-- fetch JSON into reactive state, render it with a keyed v-for; c appends -->
<div v-scope="{ rows: [], async load(v) {
  const { rows } = await (await fetch('/rows.json?n={{n}}&s={{s}}&v=' + v)).json();
  if (v === 'c') this.rows.push(...rows); else this.rows = rows;
} }">
  <button id="a" @click="load('a')">a</button> <button id="b" @click="load('b')">b</button> <button id="c" @click="load('c')">c</button>
  <table><tbody id="target"><template v-for="r in rows" :key="r.id"><tr><td class="id" v-text="r.id"></td><td class="label" v-text="r.label"></td></tr></template></tbody></table>
</div>
<script>PetiteVue.createApp().mount()</script>
</body>
</html>
