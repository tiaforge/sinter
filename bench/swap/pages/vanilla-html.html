<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>vanilla-html</title>
  <link rel="icon" href="data:,">
  <script type="module" src="./bench.js"></script>
</head>
<body>
<button id="a">a</button> <button id="b">b</button>
<table><tbody id="target"></tbody></table>
<script>
  // fetch the fragment, assign innerHTML
  for (const v of ['a', 'b']) document.getElementById(v).addEventListener('click', async () => {
    const res = await fetch('/rows.html?n={{n}}&s={{s}}&v=' + v);
    document.getElementById('target').innerHTML = await res.text();
  });
</script>
</body>
</html>
