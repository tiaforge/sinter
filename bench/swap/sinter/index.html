<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>sinter</title>
  <link rel="icon" href="data:,">
  <script type="module" src="../pages/bench.js"></script>
</head>
<body>
<!-- fetch JSON into a keyed resource, render it with data-sn-for; the URL follows `v` -->
<div data-sn-state="{ v: '' }">
  <sn-resource name="rows" src="/rows.json?n={$url.n}&s={$url.s}&v={v}" items="rows" key="id" when="v"></sn-resource>
  <button id="a" data-sn-on-click="v = 'a'">a</button> <button id="b" data-sn-on-click="v = 'b'">b</button>
  <table><tbody id="target"><template data-sn-for="r in rows" data-sn-key="r.id"><tr><td class="id" data-sn-text="r.id"></td><td class="label" data-sn-text="r.label"></td></tr></template></tbody></table>
</div>
</body>
</html>
