<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>sinter</title>
  <link href="/css/currentStyle.css" rel="stylesheet">
</head>
<body>
<div id="main" class="container" data-sn-state="{ data: [], selected: 0, next: 1 }">
  <div class="jumbotron">
    <div class="row">
      <div class="col-md-6"><h1>sinter (keyed)</h1></div>
      <div class="col-md-6">
        <div class="row">
          <div class="col-sm-6 smallpad"><button type="button" class="btn btn-primary btn-block" id="run" data-sn-on-click="data = rows(next, 1000); next += 1000">Create 1,000 rows</button></div>
          <div class="col-sm-6 smallpad"><button type="button" class="btn btn-primary btn-block" id="runlots" data-sn-on-click="data = rows(next, 10000); next += 10000">Create 10,000 rows</button></div>
          <div class="col-sm-6 smallpad"><button type="button" class="btn btn-primary btn-block" id="add" data-sn-on-click="data = data.concat(rows(next, 1000)); next += 1000">Append 1,000 rows</button></div>
          <div class="col-sm-6 smallpad"><button type="button" class="btn btn-primary btn-block" id="update" data-sn-on-click="data.forEach((row, i) => i % 10 || (row.label += ' !!!'))">Update every 10th row</button></div>
          <div class="col-sm-6 smallpad"><button type="button" class="btn btn-primary btn-block" id="clear" data-sn-on-click="data = []">Clear</button></div>
          <div class="col-sm-6 smallpad"><button type="button" class="btn btn-primary btn-block" id="swaprows" data-sn-on-click="data.length > 998 && data.splice(1, 1, data.splice(998, 1, data[1])[0])">Swap Rows</button></div>
        </div>
      </div>
    </div>
  </div>
  <table class="table table-hover table-striped test-data">
    <tbody><template data-sn-for="row in data"><tr data-sn-class="{danger: row.id === selected}"><td class="col-md-1" data-sn-text="row.id"></td><td class="col-md-4"><a data-sn-on-click="selected = row.id" data-sn-text="row.label"></a></td><td class="col-md-1"><a data-sn-on-click="data.splice(data.indexOf(row), 1)"><span class="glyphicon glyphicon-remove" aria-hidden="true"></span></a></td><td class="col-md-6"></td></tr></template></tbody>
  </table>
  <span class="preloadicon glyphicon glyphicon-remove" aria-hidden="true"></span>
</div>
</body>
</html>
