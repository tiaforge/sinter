<!doctype html>
<html>
<head><title>app</title></head>
<body>
  <sn-resource name="people" src="/api/people" key="id"></sn-resource>
  <div data-sn-state="{ q: '' }">
    <h1 data-sn-text="m.title()"></h1>
    <input data-sn-model="q">
    <button data-sn-call="greet(q)" data-sn-then="q = $result">Greet</button>
    <ul><template data-sn-for="p in people"><people-row data-sn-prop="{ p }"></people-row></template></ul>
  </div>
</body>
</html>
